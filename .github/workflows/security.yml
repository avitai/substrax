name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Every extra the lock resolves, in groups that respect [tool.uv] conflicts, each audited by
      # a pinned pip-audit with a fresh advisory cache. An environment holds only the extras it
      # installed, so an audit of it misses the rest of the lock.
      - name: Audit the locked dependencies
        uses: ./.github/actions/audit-lock

      # Bandit reports whatever the audit found, so a red job names every scan that failed.
      - name: Bandit
        if: ${{ !cancelled() }}
        run: |
          uv run bandit -r src/substrax/ -c pyproject.toml -ll
          uv run bandit -r src/substrax/ -c pyproject.toml -f json -o bandit-report.json -q

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
