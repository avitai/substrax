name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # A merge repeats the pull request; a manual run is asked for. When the step does not run
      # the output is empty, which every job reads as "test it".
      - id: compare
        if: github.event_name == 'push'
        uses: ./.github/actions/already-tested

  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: already_tested
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test


      - name: Pre-commit
        env:
          # CI's test job runs the suite on both Python versions; the hook would run it again.
          SKIP: pytest
        run: uv run pre-commit run --all-files

      - name: Pyright
        run: uv run pyright --warnings src/

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Ruff isort check
        run: uv run ruff check --select I --diff src/ tests/

      - name: Pip audit
        run: uv run pip-audit

      - name: Derived status matches the README
        run: uv run python scripts/derive_status.py --check
