# Publish to PyPI when a GitHub Release is created.
#
# PyPI trusted publishing must trust:
#   Owner: avitai
#   Repository: substrax
#   Workflow name: publish.yml
#   Environment: pypi
#
# A release runs the whole of CI (ci.yml) on the released commit and ships the distributions its
# gates built and checked, the artifact `python-package-distributions`; nothing here builds.

name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      target:
        description: "Target operation"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
          - github-release
      version_tag:
        description: "Existing vX.Y.Z tag for target=github-release"
        required: false
        type: string

jobs:
  validate:
    name: CI on the released commit
    uses: ./.github/workflows/ci.yml

  # CI built the run's ref, so a release must run from the tag v<version> of the distributions it
  # built; a manual release names that same tag. TestPyPI trials may run from any ref.
  check-release:
    name: The version matches the tag
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.target == 'pypi' || github.event.inputs.target == 'github-release'

    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: The version matches the tag
        env:
          RUN_REF: ${{ github.ref }}
          TARGET: ${{ github.event.inputs.target }}
          RELEASE_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          python3 -I - <<'PY'
          import os
          import sys
          import tarfile
          import zipfile
          from email.parser import Parser
          from pathlib import Path


          def version(path):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
                      return Parser().parsestr(archive.read(name).decode())["Version"]
              with tarfile.open(path) as archive:
                  info = next(m for m in archive.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
                  return Parser().parsestr(archive.extractfile(info).read().decode())["Version"]


          versions = sorted({version(path) for path in Path("dist").iterdir()})
          if len(versions) != 1:
              sys.exit(f"the distributions should carry one version, not {versions}")
          tag, ref = f"v{versions[0]}", os.environ["RUN_REF"]
          if ref != f"refs/tags/{tag}":
              sys.exit(f"the distributions are {tag}, but this run is on {ref}: run it from the tag {tag}")
          if os.environ["TARGET"] == "github-release" and os.environ["RELEASE_TAG"] != tag:
              sys.exit(f"version_tag is {os.environ['RELEASE_TAG']!r}, but the distributions are {tag}")
          print(f"releasing {tag}")
          PY

  create-github-release:
    name: Create GitHub Release
    needs: check-release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'github-release'

    permissions:
      contents: write

    steps:
      - name: Create release with generated notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          generate_release_notes: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/project/substrax/

    permissions:
      id-token: write

    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs:
      - validate
      - check-release
      - create-github-release
    runs-on: ubuntu-latest
    # check-release runs for exactly the events that publish here, and only after CI passed; a
    # manual release also waits for its GitHub Release.
    if: always() && needs.check-release.result == 'success' && (needs.create-github-release.result == 'success' || needs.create-github-release.result == 'skipped')

    environment:
      name: pypi
      url: https://pypi.org/project/substrax/

    permissions:
      id-token: write

    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
