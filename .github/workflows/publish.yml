# Publish to PyPI when a GitHub Release is created.
#
# PyPI trusted publishing must trust:
#   Owner: avitai
#   Repository: substrax
#   Workflow name: publish.yml
#   Environment: pypi
#
# A release runs the whole of CI (ci.yml) on the released commit and ships the distributions its
# gates built and checked, the artifact `python-package-distributions`; nothing here builds.

name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      target:
        description: "Target operation"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
          - github-release
      version_tag:
        description: "Existing vX.Y.Z tag for target=github-release"
        required: false
        type: string

jobs:
  validate:
    name: CI on the released commit
    uses: ./.github/workflows/ci.yml

  create-github-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'github-release'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.version_tag }}
          RUN_REF: ${{ github.ref }}
        run: |
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "version_tag is required when target=github-release" >&2
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null || {
            echo "Release tag ${RELEASE_TAG} does not exist" >&2
            exit 1
          }
          # CI built the run's ref, so the release ships only what was built from the tag itself.
          if [[ "${RUN_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "Run this workflow from the tag: --ref ${RELEASE_TAG}, not ${RUN_REF}" >&2
            exit 1
          fi

      - name: Create release with generated notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          generate_release_notes: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/project/substrax/

    permissions:
      id-token: write

    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs:
      - validate
      - create-github-release
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (
        github.event_name == 'release' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.event.inputs.target == 'pypi' ||
            github.event.inputs.target == 'github-release'
          )
        )
      ) &&
      (
        needs.create-github-release.result == 'success' ||
        needs.create-github-release.result == 'skipped'
      )

    environment:
      name: pypi
      url: https://pypi.org/project/substrax/

    permissions:
      id-token: write

    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
