name: macOS

# macOS runners are scarce and slow, so no push or pull request runs on them. This workflow runs
# the suite and the build on macOS nightly when main has moved, and on demand: RELEASING.md runs it
# on the release commit before the tag.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  main_moved:
    name: Main moved since the last green night
    runs-on: ubuntu-latest
    outputs:
      unchanged: ${{ steps.compare.outputs.unchanged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only a scheduled run compares; a manual run, a failed lookup or a first night always runs.
      - id: compare
        uses: ./.github/actions/main-moved
        with:
          workflow: macos.yml

  # The shared gates with the tests and the build on macOS, under their two-runner cap; lint, the
  # audit and the docs run on ubuntu as on every pull request.
  gates:
    name: Gates on macOS
    needs: main_moved
    if: needs.main_moved.outputs.unchanged != 'true'
    uses: ./.github/workflows/python-gates.yml
    with:
      package: substrax
      pytest-args: tests/ -p randomly -v
      import-modules: substrax substrax.devices substrax.mesh substrax.spmd substrax.checkpoint substrax.callbacks substrax.tracking
      os: macos-14
