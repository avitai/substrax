name: CI

# The one workflow a pull request runs. Its jobs are the shared gates in python-gates.yml, which
# every stack repository calls the same way, and the checks only substrax has. `required` is the
# one check main's ruleset requires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # the weekly dependency audit
  workflow_dispatch:

concurrency:
  # The event is part of the group, so the weekly audit and a merge's run never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A merge repeats the pull request; a schedule or a manual run is asked for. When the step
      # does not run the output is empty, which every job reads as "test it".
      - id: compare
        if: github.event_name == 'push'
        uses: ./.github/actions/already-tested

  gates:
    name: Gates
    needs: already_tested
    uses: ./.github/workflows/python-gates.yml
    with:
      package: substrax
      pytest-args: tests/ -p randomly -v
      import-modules: substrax substrax.devices substrax.mesh substrax.spmd substrax.checkpoint substrax.callbacks substrax.tracking
      already-tested: ${{ needs.already_tested.outputs.skip }}
      only-security: ${{ github.event_name == 'schedule' }}

  checkpoint-orbax-floor:
    name: Checkpoint tests on the Orbax floor
    needs: already_tested
    if: needs.already_tested.outputs.skip != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TF_CPP_MIN_LOG_LEVEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # The uv python-gates.yml pins, so these jobs and the gates resolve alike.
          version: "0.13.1"
          enable-cache: true
          prune-cache: true

      - name: Install the environment from the lock
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv sync --locked --extra dev --extra test

      - name: Pin Orbax to the floor
        run: uv pip install orbax-checkpoint==0.11.33

      - name: The floor is installed
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; v = m.version('orbax-checkpoint'); assert v == '0.11.33', v; print(v)"

      - name: Run the checkpoint tests
        run: uv run --no-sync pytest tests/checkpoint --no-cov -p no:randomly

  derive-status:
    name: Derived status matches the README
    needs: already_tested
    if: needs.already_tested.outputs.skip != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          prune-cache: true

      - name: Install the environment from the lock
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv sync --locked --extra dev --extra test

      - name: Derived status matches the README
        run: uv run --no-sync python scripts/derive_status.py --check

  required:
    name: required
    # Runs whatever the jobs above did, and fails unless each succeeded or was skipped on purpose:
    # a proven merge and the weekly audit stand work down, a pull request may skip nothing.
    if: always()
    needs: [already_tested, gates, checkpoint-orbax-floor, derive-status]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ github.event_name == 'pull_request' && '' || 'gates, checkpoint-orbax-floor, derive-status' }}
