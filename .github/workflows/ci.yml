name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # A merge repeats the pull request; a manual run is asked for. When the step does not run
      # the output is empty, which every job reads as "test it".
      - id: compare
        if: github.event_name == 'push'
        uses: ./.github/actions/already-tested

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: already_tested
    if: needs.already_tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pyright
        run: uv run pyright --warnings src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    # macOS runs nightly and before a release, in macos.yml.
    runs-on: ubuntu-latest
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TF_CPP_MIN_LOG_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-line coverage gate diffs against origin/main.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test


      - name: Run tests
        run: |
          uv run pytest tests/ \
            -p randomly -v --cov-report=xml

      # The package-wide floor lets a pull request add an untested module; this gates the lines
      # the pull request changes, from the coverage the run above measured.
      - name: Coverage on changed lines (at least 80%)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: uv run --no-sync diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 --show-uncovered

  checkpoint-orbax-floor:
    name: Checkpoint tests on the Orbax floor
    runs-on: ubuntu-latest
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TF_CPP_MIN_LOG_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Pin Orbax to the floor
        run: uv pip install orbax-checkpoint==0.11.33

      - name: The floor is installed
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; v = m.version('orbax-checkpoint'); assert v == '0.11.33', v; print(v)"


      - name: Run the checkpoint tests
        run: uv run --no-sync pytest tests/checkpoint --no-cov -p no:randomly

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          uv sync --locked --extra dev --extra test
          uv run twine check --strict dist/*
