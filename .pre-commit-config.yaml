ci:
  autofix_prs: false
  autoupdate_schedule: weekly

default_language_version:
  node: 22.21.1

repos:
  # Sort pyproject.toml keys for consistency
  - repo: local
    hooks:
      - id: sort_pyproject
        name: sort pyproject.toml
        entry: toml-sort
        args: [--in-place, --all]
        files: pyproject\.toml
        language: python
        additional_dependencies: ["toml-sort==0.23.1"]

  # Schema-check pyproject.toml
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: mkdocs\.yml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: mixed-line-ending

  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Gates that need the project environment (Rules 1, 2, 3, 11; YAGNI)
  - repo: local
    hooks:
      - id: check-file-length
        name: check-file-length (warn >1500, fail >2000 lines)
        entry: bash
        args:
          - -c
          - |
            for file in "$@"; do
              lines=$(wc -l < "$file" 2>/dev/null || echo 0)
              if [ "$lines" -gt 2000 ]; then
                echo "ERROR: $file has $lines lines (limit: 2000)"
                exit 1
              elif [ "$lines" -gt 1500 ]; then
                echo "WARNING: $file has $lines lines (approaching limit of 2000)"
              fi
            done
          - --
        language: system
        types: [python]
        exclude: ^tests/

      - id: pyright
        name: pyright (strict)
        entry: uv run --no-sync pyright
        language: system
        pass_filenames: false
        types: [python]

      - id: lint-imports
        name: lint-imports (layered architecture)
        entry: uv run --no-sync lint-imports
        language: system
        pass_filenames: false
        files: ^(src/substrax/|\.importlinter$)

      - id: interrogate
        name: interrogate (docstring coverage)
        entry: uv run --no-sync interrogate src/
        language: system
        pass_filenames: false
        files: ^src/substrax/.*\.py$

      - id: pydoclint
        name: pydoclint (docstring sections match signatures)
        entry: uv run --no-sync pydoclint src/
        language: system
        pass_filenames: false
        files: ^src/substrax/.*\.py$

      - id: xenon
        name: xenon (cyclomatic complexity gate)
        entry: uv run --no-sync xenon --max-absolute B --max-modules A --max-average A src/
        language: system
        pass_filenames: false
        files: ^src/substrax/.*\.py$

      - id: pylint-duplicate-code
        name: pylint-duplicate-code (DRY)
        entry: uv run --no-sync pylint --disable=all --enable=duplicate-code,too-many-public-methods,too-many-instance-attributes,too-many-ancestors src/
        language: system
        pass_filenames: false
        files: ^src/substrax/.*\.py$

      - id: vulture
        name: vulture (dead code)
        entry: uv run --no-sync vulture src/ --min-confidence 80
        language: system
        pass_filenames: false
        files: ^src/substrax/.*\.py$

      - id: deptry
        name: deptry (declared vs imported dependencies)
        entry: uv run --no-sync deptry .
        language: system
        pass_filenames: false
        files: ^(src/substrax/|pyproject\.toml$)

      - id: bandit
        name: bandit (source security)
        entry: uv run --no-sync bandit -c pyproject.toml -r src/ -ll -q
        language: system
        pass_filenames: false
        files: ^src/substrax/.*\.py$

      - id: pytest
        name: pytest (the suite, with the coverage floor)
        entry: uv run --no-sync pytest -q --no-header
        language: system
        pass_filenames: false
        files: ^(src/|tests/|conftest\.py$|pyproject\.toml$)

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint-fix
        args: [--disable, MD013, MD033, MD041, --]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1091]
