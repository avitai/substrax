site_name: Substrax
site_url: https://substrax.readthedocs.io
site_description: Shared training and hardware infrastructure for the Avitai JAX stack
site_author: Mahdi Shafiei

repo_url: https://github.com/avitai/substrax
repo_name: avitai/substrax
edit_uri: edit/main/docs/

docs_dir: docs/
site_dir: site/
strict: true

theme:
  name: material
  icon:
    logo: material/layers-triple
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            merge_init_into_class: true
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: "¤"
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Migration: migration.md
  - API Reference:
      - Devices: api/devices.md
      - Mesh: api/mesh.md
      - SPMD: api/spmd.md
      - Checkpoint: api/checkpoint.md
      - Callbacks: api/callbacks.md
      - Tracking: api/tracking.md
